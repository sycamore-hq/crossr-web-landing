name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Live-copy tests
        run: python3 -m unittest discover -s test -v
      - name: Live-copy gate
        run: python3 scripts/live_copy.py
