name: Deploy CrossR door

# One-time: repo Settings → Pages → Source = GitHub Actions.
# Host: https://sycamore-hq.github.io/crossr-web-landing/
# No custom domain.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "book/**"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Zola
        run: |
          ZOLA_VERSION="0.19.2"
          curl -L "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar xz
          sudo mv zola /usr/local/bin/
          zola --version

      - name: Install mdBook
        run: |
          MDBOOK_VERSION="0.4.40"
          curl -L "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar xz
          sudo mv mdbook /usr/local/bin/
          mdbook --version

      - name: Build book → site/static/docs
        run: |
          mkdir -p site/static/docs
          mdbook build book --dest-dir ../site/static/docs

      - name: Build door (Zola)
        run: |
          cd site
          zola build --force

      - name: Verify docs landed
        run: |
          test -f site/public/docs/index.html
          test -f site/public/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
