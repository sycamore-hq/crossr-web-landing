<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CrossR · house palette</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap");
    body { font-family: Inter, system-ui, sans-serif; background: #171412; color: #F3EEE6; }
    .font-display { font-family: Fraunces, Georgia, serif; }
  </style>
</head>
<body class="min-h-screen">
  <main class="max-w-3xl mx-auto px-6 py-16">
    <p class="text-xs uppercase tracking-widest text-[#6A7348] mb-2">Sycamore HQ</p>
    <h1 class="font-display text-4xl mb-2">House palette</h1>
    <p class="text-[#C4A882] mb-10">Low crown. Height enough. No forge leftovers.</p>
    <ul class="space-y-3 text-sm">
      <li class="flex items-center gap-3"><span class="w-10 h-10 rounded" style="background:#171412;border:1px solid #C4A882"></span> Well pitch <code class="ml-auto text-[#C4A882]">#171412</code></li>
      <li class="flex items-center gap-3"><span class="w-10 h-10 rounded" style="background:#F3EEE6"></span> Plaster page <code class="ml-auto text-[#C4A882]">#F3EEE6</code></li>
      <li class="flex items-center gap-3"><span class="w-10 h-10 rounded" style="background:#C4A882"></span> Packed mile <code class="ml-auto text-[#C4A882]">#C4A882</code></li>
      <li class="flex items-center gap-3"><span class="w-10 h-10 rounded" style="background:#9E4E36"></span> Split fig <code class="ml-auto text-[#C4A882]">#9E4E36</code></li>
      <li class="flex items-center gap-3"><span class="w-10 h-10 rounded" style="background:#6A7348"></span> Dust leaf <code class="ml-auto text-[#C4A882]">#6A7348</code></li>
      <li class="flex items-center gap-3"><span class="w-10 h-10 rounded" style="background:#2E342C"></span> Canopy shade <code class="ml-auto text-[#C4A882]">#2E342C</code></li>
    </ul>
    <p class="mt-12 text-sm text-[#C4A882]"><a href="../">← door</a></p>
  </main>
</body>
</html>
